      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; letter-spacing: .5px; }
      .p { shape-rendering: crispEdges; }
      @keyframes pulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="980" height="86" rx="14" fill="#071018"/>
  <g class="p pulse">
    <rect x="20" y="18" width="138" height="50" rx="8" fill="#0b1e27" stroke="#33f5c5" stroke-width="3"/>
    <text x="42" y="50" class="t" font-size="20" fill="#33f5c5">PIX</text>
    <rect x="176" y="18" width="192" height="50" rx="8" fill="#11102b" stroke="#9b7cff" stroke-width="3"/>
    <text x="196" y="50" class="t" font-size="20" fill="#c5b4ff">FULLSTACK</text>
    <rect x="386" y="18" width="126" height="50" rx="8" fill="#231c08" stroke="#ffd166" stroke-width="3"/>
    <text x="424" y="50" class="t" font-size="20" fill="#ffd166">AI</text>
    <rect x="530" y="18" width="148" height="50" rx="8" fill="#27101c" stroke="#ff5ca8" stroke-width="3"/>
    <text x="570" y="50" class="t" font-size="20" fill="#ff8fc3">WEB3</text>
    <rect x="696" y="18" width="116" height="50" rx="8" fill="#0b1e27" stroke="#33f5c5" stroke-width="3"/>
    <text x="736" y="50" class="t" font-size="20" fill="#33f5c5">AX</text>
