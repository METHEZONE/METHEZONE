<svg width="1200" height="80" viewBox="0 0 1200 80" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pixel arcade divider">
  <defs>
    <style>
      .p { shape-rendering: crispEdges; }
      @keyframes travel { from { transform: translateX(-120px); } to { transform: translateX(120px); } }
      .move { animation: travel 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    </style>
  </defs>
  <rect width="1200" height="80" rx="16" fill="#071018"/>
  <g class="p" opacity=".95">
    <rect x="36" y="34" width="928" height="12" fill="#203149"/>
    <rect x="36" y="34" width="180" height="12" fill="#33f5c5"/>
    <rect x="250" y="34" width="112" height="12" fill="#ffd166"/>
    <rect x="398" y="34" width="166" height="12" fill="#ff5ca8"/>
    <rect x="598" y="34" width="128" height="12" fill="#9b7cff"/>
    <rect x="760" y="34" width="204" height="12" fill="#33f5c5"/>
    <g class="move">
      <rect x="1002" y="20" width="40" height="40" fill="#ffd166"/>
      <rect x="1014" y="32" width="6" height="6" fill="#071018"/>
      <rect x="1030" y="32" width="6" height="6" fill="#071018"/>
      <rect x="1018" y="50" width="14" height="4" fill="#071018"/>
    </g>
    <text x="48" y="25" fill="#c7fff5" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">SYSTEM: METHEZONE PROFILE ARCADE</text>
  </g>
</svg>
