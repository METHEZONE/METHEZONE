<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">ARCA is running</title>
  <desc id="d">ARCA, a small blue companion robot, runs across a futuristic horizon past milestone gates: ZER01NE, AGORA, ZONEBRAIN, PIX, LOCK-IN COFFEE, and BALI.</desc>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.62" stop-color="#0a0f22"/>
      <stop offset="0.78" stop-color="#141031"/>
      <stop offset="1" stop-color="#08060f"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4dff" stop-opacity="0"/>
      <stop offset="1" stop-color="#5a4dff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="groundFade" x1="0" y1="252" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a6cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7a6cff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66a3ff"/>
      <stop offset="0.7" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#7d5cff"/>
    </linearGradient>
    <radialGradient id="moonG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c6e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff5c6e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff5c6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style><![CDATA[
      .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }

      .far  { animation: scroll 60s linear infinite; }
      .mid  { animation: scroll 24s linear infinite; }
      .near { animation: scroll 10s linear infinite; }
      @keyframes scroll { from { transform: translateX(0);} to { transform: translateX(-1600px);} }

      .bob   { animation: bob 0.42s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(0);} to { transform: translateY(-5px);} }

      .legA { animation: legA 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
      .legB { animation: legB 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
      @keyframes legA { from { transform: rotate(26deg);}  to { transform: rotate(-26deg);} }
      @keyframes legB { from { transform: rotate(-26deg);} to { transform: rotate(26deg);} }

      .armA { animation: legB 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
      .armB { animation: legA 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }

      .blinkEyes { animation: blinkE 4.6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes blinkE { 0%,92%,100% { transform: scaleY(1);} 95% { transform: scaleY(0.08);} }

      .antenna { animation: ping 1.6s ease-in-out infinite; }
      @keyframes ping { 0%,100% { opacity: 0.35;} 50% { opacity: 1;} }

      .shadow { animation: shadowPulse 0.42s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes shadowPulse { from { transform: scaleX(1); opacity: 0.4;} to { transform: scaleX(0.82); opacity: 0.24;} }

      .trail1 { animation: trail 0.7s linear infinite; }
      .trail2 { animation: trail 0.7s linear infinite; animation-delay: -0.23s; }
      .trail3 { animation: trail 0.7s linear infinite; animation-delay: -0.46s; }
      @keyframes trail { from { transform: translateX(0); opacity: 0.8;} to { transform: translateX(-58px); opacity: 0;} }

      .bubble { animation: bubble 11s ease-in-out infinite; }
      @keyframes bubble { 0%,7% { opacity: 0; transform: translateY(4px);} 12%,30% { opacity: 1; transform: translateY(0);} 36%,100% { opacity: 0; transform: translateY(-4px);} }

      .tw1,.tw2 { animation: tw2 3.8s ease-in-out infinite; }
      .tw2 { animation-delay: -1.7s; }
      @keyframes tw2 { 0%,100% { opacity: 0.15;} 50% { opacity: 0.85;} }
    ]]></style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky2)"/>
  <circle cx="985" cy="92" r="120" fill="url(#moonG)"/>
  <circle cx="985" cy="92" r="34" fill="#1b0f22" stroke="#ff5c6e" stroke-width="1.5"/>
  <circle cx="985" cy="92" r="42" fill="none" stroke="#ff5c6e" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 6"/>

  <g fill="#cdd8ff">
    <circle class="tw1" cx="120" cy="60" r="1.3"/>
    <circle class="tw2" cx="330" cy="110" r="1.1"/>
    <circle class="tw1" cx="520" cy="48" r="1.2"/>
    <circle class="tw2" cx="700" cy="90" r="1.0"/>
    <circle class="tw1" cx="840" cy="40" r="1.2"/>
    <circle class="tw2" cx="1120" cy="150" r="1.1"/>
  </g>

  <!-- far skyline -->
  <g class="far" fill="#10162e">
    <g>
      <path d="M0 252 V196 h34 v-22 h20 v22 h30 v56 Z M120 252 v-40 h26 v-18 h16 v58 Z M210 252 v-64 h22 l8 -14 8 14 h22 v64 Z M320 252 v-34 h48 v34 Z M410 252 v-52 h18 v-20 h14 v20 h20 v52 Z M510 252 v-30 h40 v30 Z M600 252 v-70 h16 v-16 h12 v16 h20 v70 Z M700 252 v-42 h30 v42 Z M780 252 v-58 h20 v-14 h16 v14 h18 v58 Z M880 252 v-30 h44 v30 Z M980 252 v-50 h26 v50 Z M1060 252 v-66 h18 v-18 h14 v18 h20 v66 Z M1160 252 v-36 h40 v36 Z M1250 252 v-56 h30 v56 Z M1340 252 v-40 h36 v40 Z M1430 252 v-62 h24 v-16 h14 v16 h20 v62 Z M1540 252 v-32 h40 v32 Z"/>
      <g transform="translate(1600,0)">
        <path d="M0 252 V196 h34 v-22 h20 v22 h30 v56 Z M120 252 v-40 h26 v-18 h16 v58 Z M210 252 v-64 h22 l8 -14 8 14 h22 v64 Z M320 252 v-34 h48 v34 Z M410 252 v-52 h18 v-20 h14 v20 h20 v52 Z M510 252 v-30 h40 v30 Z M600 252 v-70 h16 v-16 h12 v16 h20 v70 Z M700 252 v-42 h30 v42 Z M780 252 v-58 h20 v-14 h16 v14 h18 v58 Z M880 252 v-30 h44 v30 Z M980 252 v-50 h26 v50 Z M1060 252 v-66 h18 v-18 h14 v18 h20 v66 Z M1160 252 v-36 h40 v36 Z M1250 252 v-56 h30 v56 Z M1340 252 v-40 h36 v40 Z M1430 252 v-62 h24 v-16 h14 v16 h20 v62 Z M1540 252 v-32 h40 v32 Z"/>
      </g>
    </g>
  </g>
  <g class="far" fill="#f4c95d" opacity="0.5">
    <g>
      <rect x="46" y="206" width="3" height="3"/><rect x="222" y="200" width="3" height="3"/><rect x="614" y="192" width="3" height="3"/><rect x="792" y="204" width="3" height="3"/><rect x="1072" y="196" width="3" height="3"/><rect x="1438" y="200" width="3" height="3"/>
      <g transform="translate(1600,0)"><rect x="46" y="206" width="3" height="3"/><rect x="222" y="200" width="3" height="3"/><rect x="614" y="192" width="3" height="3"/><rect x="792" y="204" width="3" height="3"/><rect x="1072" y="196" width="3" height="3"/><rect x="1438" y="200" width="3" height="3"/></g>
    </g>
  </g>

  <rect x="0" y="182" width="1200" height="70" fill="url(#horizonGlow)"/>

  <!-- milestone gates (mid layer) -->
  <g class="mid">
    <g>
      <g class="mono" font-size="11" letter-spacing="1.5">
        <g transform="translate(180,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ffd166" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ffd166"/>
          <text x="10" y="196" fill="#ffd166">ZER01NE ✦ 1ST</text>
          <text x="10" y="210" fill="#5d6584">hyundai sprint '26</text>
        </g>
        <g transform="translate(470,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#7ee2c3" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#7ee2c3"/>
          <text x="10" y="196" fill="#7ee2c3">AGORA</text>
          <text x="10" y="210" fill="#5d6584">agent marketplace</text>
        </g>
        <g transform="translate(730,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#9db4ff" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#9db4ff"/>
          <text x="10" y="196" fill="#9db4ff">ZONEBRAIN</text>
          <text x="10" y="210" fill="#5d6584">memory graph</text>
        </g>
        <g transform="translate(990,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#c99bff" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#c99bff"/>
          <text x="10" y="196" fill="#c99bff">PIX</text>
          <text x="10" y="210" fill="#5d6584">companion</text>
        </g>
        <g transform="translate(1230,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ff9d76" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ff9d76"/>
          <text x="10" y="196" fill="#ff9d76">LOCK-IN COFFEE</text>
          <text x="10" y="210" fill="#5d6584">the vessel</text>
        </g>
        <g transform="translate(1460,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ff8296" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ff8296"/>
          <text x="10" y="196" fill="#ff8296">BALI →</text>
          <text x="10" y="210" fill="#5d6584">2026.09</text>
        </g>
      </g>
      <g transform="translate(1600,0)" class="mono" font-size="11" letter-spacing="1.5">
        <g transform="translate(180,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ffd166" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ffd166"/>
          <text x="10" y="196" fill="#ffd166">ZER01NE ✦ 1ST</text>
          <text x="10" y="210" fill="#5d6584">hyundai sprint '26</text>
        </g>
        <g transform="translate(470,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#7ee2c3" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#7ee2c3"/>
          <text x="10" y="196" fill="#7ee2c3">AGORA</text>
          <text x="10" y="210" fill="#5d6584">agent marketplace</text>
        </g>
        <g transform="translate(730,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#9db4ff" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#9db4ff"/>
          <text x="10" y="196" fill="#9db4ff">ZONEBRAIN</text>
          <text x="10" y="210" fill="#5d6584">memory graph</text>
        </g>
        <g transform="translate(990,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#c99bff" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#c99bff"/>
          <text x="10" y="196" fill="#c99bff">PIX</text>
          <text x="10" y="210" fill="#5d6584">companion</text>
        </g>
        <g transform="translate(1230,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ff9d76" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ff9d76"/>
          <text x="10" y="196" fill="#ff9d76">LOCK-IN COFFEE</text>
          <text x="10" y="210" fill="#5d6584">the vessel</text>
        </g>
        <g transform="translate(1460,0)">
          <line x1="0" y1="252" x2="0" y2="188" stroke="#ff8296" stroke-width="1.5"/>
          <circle cx="0" cy="184" r="3" fill="#ff8296"/>
          <text x="10" y="196" fill="#ff8296">BALI →</text>
          <text x="10" y="210" fill="#5d6584">2026.09</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ground -->
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#8f7bff" stroke-width="1.5" opacity="0.9"/>
  <g class="near" stroke="url(#groundFade)" stroke-width="1">
    <g>
      <path d="M40 252 L-60 340 M200 252 L120 340 M360 252 L300 340 M520 252 L480 340 M680 252 L660 340 M840 252 L840 340 M1000 252 L1020 340 M1160 252 L1200 340 M1320 252 L1380 340 M1480 252 L1560 340"/>
      <g transform="translate(1600,0)"><path d="M40 252 L-60 340 M200 252 L120 340 M360 252 L300 340 M520 252 L480 340 M680 252 L660 340 M840 252 L840 340 M1000 252 L1020 340 M1160 252 L1200 340 M1320 252 L1380 340 M1480 252 L1560 340"/></g>
    </g>
  </g>
  <g stroke="#2a2350" stroke-width="1" opacity="0.8">
    <path d="M0 274 H1200 M0 302 H1200"/>
  </g>

  <!-- ARCA -->
  <g transform="translate(230,0)">
    <ellipse class="shadow" cx="0" cy="254" rx="34" ry="6" fill="#000"/>
    <g class="trail1"><rect x="-52" y="212" width="26" height="2" rx="1" fill="#6f8dff" opacity="0.7"/></g>
    <g class="trail2"><rect x="-46" y="226" width="20" height="2" rx="1" fill="#8f7bff" opacity="0.6"/></g>
    <g class="trail3"><rect x="-50" y="240" width="24" height="2" rx="1" fill="#ff8296" opacity="0.5"/></g>

    <g class="bob">
      <!-- legs -->
      <g class="legA"><rect x="-13" y="228" width="9" height="22" rx="4.5" fill="#3d55c8"/></g>
      <g class="legB"><rect x="5"  y="228" width="9" height="22" rx="4.5" fill="#3d55c8"/></g>
      <!-- arms -->
      <g class="armA"><rect x="-30" y="196" width="8" height="20" rx="4" fill="#4f6bff"/></g>
      <g class="armB"><rect x="23"  y="196" width="8" height="20" rx="4" fill="#4f6bff"/></g>
      <!-- body -->
      <rect x="-28" y="168" width="56" height="66" rx="26" fill="url(#body)"/>
      <rect x="-28" y="168" width="56" height="66" rx="26" fill="none" stroke="#a8c4ff" stroke-opacity="0.5" stroke-width="1"/>
      <!-- face screen -->
      <rect x="-19" y="180" width="38" height="26" rx="12" fill="#0a0d1f"/>
      <g class="blinkEyes" fill="#7ee2ff">
        <ellipse cx="-7" cy="192" rx="3.4" ry="4.6"/>
        <ellipse cx="8"  cy="192" rx="3.4" ry="4.6"/>
      </g>
      <path d="M-4 199 q4 3.4 8 0" stroke="#7ee2ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- chest core: blue→red heart -->
      <circle cx="0" cy="220" r="5" fill="#ff4d5e" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="220" r="8.5" fill="none" stroke="#ff4d5e" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="6;11" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="1.3s" repeatCount="indefinite"/>
      </circle>
      <!-- antenna -->
      <line x1="0" y1="168" x2="0" y2="152" stroke="#a8c4ff" stroke-width="2"/>
      <circle class="antenna" cx="0" cy="149" r="4" fill="#ff8296"/>
      <circle class="antenna" cx="0" cy="149" r="8" fill="#ff8296" opacity="0.25" filter="url(#soft2)"/>
      <!-- speech bubble -->
      <g class="bubble">
        <rect x="18" y="122" width="150" height="26" rx="13" fill="#0d1226" stroke="#31406e" stroke-width="1"/>
        <path d="M30 148 l-6 9 l14 -8" fill="#0d1226" stroke="#31406e" stroke-width="1"/>
        <text x="93" y="139" text-anchor="middle" class="mono" font-size="11" fill="#9db4ff">running the company brain</text>
      </g>
    </g>
  </g>

  <g class="mono" font-size="11" letter-spacing="2" fill="#59617e">
    <text x="70" y="46">ZONE://AGENT.ARCA</text>
    <text x="1130" y="46" text-anchor="end">STATE: RUNNING&#160;&#160;·&#160;&#160;UPTIME: ∞</text>
  </g>
</svg>
