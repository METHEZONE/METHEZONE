<svg width="1200" height="26" viewBox="0 0 1200 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8dff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8f7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dfe8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .s { animation: sweep 4.2s cubic-bezier(0.6,0,0.4,1) infinite; }
      @keyframes sweep { from { transform: translateX(-260px);} to { transform: translateX(1300px);} }
    ]]></style>
  </defs>
  <rect x="0" y="12" width="1200" height="1.5" fill="url(#dl)"/>
  <g class="s"><rect x="0" y="11.5" width="220" height="2.5" rx="1" fill="url(#streak)"/></g>
  <circle cx="600" cy="13" r="2.5" fill="#8f7bff" opacity="0.9"/>
</svg>
