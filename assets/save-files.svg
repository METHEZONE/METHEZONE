<svg width="980" height="260" viewBox="0 0 980 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured save files for METHEZONE">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33f5c5"/>
      <stop offset=".45" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hud { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-size: 34px; font-weight: 900; }
      .body { font-size: 19px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 700; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes scan { from { transform: translateX(-260px); } to { transform: translateX(980px); } }
      .bob { animation: bob 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scan { animation: scan 5.5s linear infinite; opacity: .25; }
    </style>
  </defs>
  <rect width="980" height="260" rx="18" fill="#071018"/>
  <rect x="4" y="4" width="972" height="252" rx="15" stroke="url(#edge)" stroke-width="4"/>
  <rect class="scan" x="0" y="0" width="190" height="260" fill="#ffffff"/>

  <a href="https://github.com/METHEZONE/pix">
    <g transform="translate(32 34)">
      <rect width="424" height="192" rx="14" fill="#0b1624" stroke="#33f5c5" stroke-width="3"/>
      <text x="28" y="48" class="hud title" fill="#33f5c5">PIX</text>
      <text x="28" y="82" class="hud body" fill="#c7fff5">AI companion save file</text>
      <text x="28" y="116" class="hud small" fill="#86a6b9">Swift / memory / gamified life</text>
      <text x="28" y="146" class="hud small" fill="#ffd166">status: in progress</text>
      <g transform="translate(306 46)" filter="url(#glow)">
        <g class="bob">
          <ellipse cx="42" cy="70" rx="24" ry="22" fill="#c084fc"/>
          <ellipse cx="42" cy="74" rx="14" ry="12" fill="#e9d5ff"/>
          <circle cx="42" cy="40" r="24" fill="#c084fc"/>
          <ellipse cx="22" cy="22" rx="7" ry="12" fill="#a855f7"/>
          <ellipse cx="62" cy="22" rx="7" ry="12" fill="#a855f7"/>
          <circle cx="34" cy="38" r="7" fill="#ffffff"/>
          <circle cx="50" cy="38" r="7" fill="#ffffff"/>
          <circle cx="35" cy="39" r="4" fill="#4c1d95"/>
          <circle cx="51" cy="39" r="4" fill="#4c1d95"/>
          <path d="M32 52Q42 61 52 52" stroke="#7e22ce" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </a>

  <a href="https://github.com/METHEZONE/ychack">
    <g transform="translate(524 34)">
      <rect width="424" height="192" rx="14" fill="#0b1624" stroke="#ff5ca8" stroke-width="3"/>
      <text x="28" y="48" class="hud title" fill="#ff5ca8">YCHACK</text>
      <text x="28" y="82" class="hud body" fill="#c7fff5">super useful build slot</text>
      <text x="28" y="116" class="hud small" fill="#86a6b9">TypeScript / web / product systems</text>
      <text x="28" y="146" class="hud small" fill="#ffd166">status: active experiment</text>
      <g transform="translate(300 54)" filter="url(#glow)">
        <g class="bob" style="animation-delay:-1s">
          <rect x="0" y="0" width="76" height="76" rx="10" fill="#26112b" stroke="#ff5ca8" stroke-width="5"/>
          <rect x="20" y="22" width="10" height="10" fill="#33f5c5"/>
          <rect x="48" y="22" width="10" height="10" fill="#33f5c5"/>
          <rect x="18" y="48" width="42" height="8" fill="#ffd166"/>
        </g>
      </g>
    </g>
  </a>
</svg>
