<svg width="980" height="320" viewBox="0 0 980 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="METHEZONE player stats">
  <defs>
    <linearGradient id="meter" x1="0" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33f5c5"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#ff5ca8"/>
    </linearGradient>
    <style>
      .hud { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { font-size: 20px; font-weight: 800; fill: #c7fff5; }
      .title { font-size: 30px; font-weight: 900; fill: #f2fffb; }
      .small { font-size: 16px; font-weight: 700; fill: #86a6b9; }
      @keyframes fill { 0%,100% { transform: scaleX(.78); } 50% { transform: scaleX(1); } }
      @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .fill { animation: fill 4s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
      .blink { animation: blink 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="980" height="320" rx="18" fill="#071018"/>
  <rect x="4" y="4" width="972" height="312" rx="15" stroke="#33f5c5" stroke-width="3"/>
  <text x="34" y="54" class="hud title">PLAYER STATS</text>
  <text x="780" y="54" class="hud small">LOCAL SVG</text>

  <g transform="translate(36 86)">
    <text class="hud label" x="0" y="22">FULLSTACK</text>
    <rect x="160" y="4" width="440" height="24" rx="5" fill="#132336"/>
    <rect class="fill" x="160" y="4" width="440" height="24" rx="5" fill="url(#meter)"/>

    <text class="hud label" x="0" y="66">AI / AX</text>
    <rect x="160" y="48" width="440" height="24" rx="5" fill="#132336"/>
    <rect class="fill" x="160" y="48" width="408" height="24" rx="5" fill="#33f5c5" style="animation-delay:-.8s"/>

    <text class="hud label" x="0" y="110">WEB3</text>
    <rect x="160" y="92" width="440" height="24" rx="5" fill="#132336"/>
    <rect class="fill" x="160" y="92" width="380" height="24" rx="5" fill="#ff5ca8" style="animation-delay:-1.4s"/>

    <text class="hud label" x="0" y="154">SHIP SPEED</text>
    <rect x="160" y="136" width="440" height="24" rx="5" fill="#132336"/>
    <rect class="fill" x="160" y="136" width="424" height="24" rx="5" fill="#ffd166" style="animation-delay:-2s"/>
  </g>

  <text x="66" y="284" class="hud small blink">Swift / TypeScript / Python / Solidity / agents / wallets</text>
</svg>
