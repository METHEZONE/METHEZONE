<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">ZONE://OS — Minsung Park (METHEZONE)</title>
  <desc id="d">Cinematic boot screen for THE ZONE operating system. A blue-to-red wordmark breathes at the center while a boot log types out below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.55" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#0a0714"/>
    </linearGradient>
    <linearGradient id="mark" x1="330" y1="0" x2="870" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8dff"/>
      <stop offset="0.45" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8dff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8f7bff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e5bff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2e5bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b5c" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff3b5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#aecdff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="typeClip">
      <rect class="typeRect" x="70" y="342" width="330" height="20"/>
    </clipPath>
    <path id="orbit" d="M 600 218 m -450 0 a 450 118 0 1 0 900 0 a 450 118 0 1 0 -900 0"/>
    <style><![CDATA[
      .mono { font-family: 'SF Mono','JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,monospace; }
      .disp { font-family: -apple-system,'SF Pro Display','Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif; }
      .dim  { fill: #59617e; }
      .lit  { fill: #aab3d0; }

      .aB { animation: driftB 16s ease-in-out infinite alternate; }
      .aR { animation: driftR 19s ease-in-out infinite alternate; }
      @keyframes driftB { from { transform: translate(-60px,-14px);} to { transform: translate(90px,26px);} }
      @keyframes driftR { from { transform: translate(70px,20px);}  to { transform: translate(-80px,-18px);} }

      .breathe { animation: breathe 5.2s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: 0.35;} 50% { opacity: 0.85;} }

      .tw1,.tw2,.tw3 { animation: tw 3.4s ease-in-out infinite; }
      .tw2 { animation-delay: -1.2s; } .tw3 { animation-delay: -2.3s; }
      @keyframes tw { 0%,100% { opacity: 0.12;} 50% { opacity: 0.9;} }

      .scanline { animation: scanmove 8s linear infinite; }
      @keyframes scanmove { from { transform: translateY(-120px);} to { transform: translateY(460px);} }

      .rot { animation: rot 12s ease-in-out infinite; }
      @keyframes rot {
        0%,26%  { opacity: 1; } 33%,93% { opacity: 0; } 100% { opacity: 1; }
      }
      .rot2 { animation: rot2 12s ease-in-out infinite; }
      @keyframes rot2 {
        0%,26% { opacity: 0; } 33%,59% { opacity: 1; } 66%,100% { opacity: 0; }
      }
      .rot3 { animation: rot3 12s ease-in-out infinite; }
      @keyframes rot3 {
        0%,59% { opacity: 0; } 66%,93% { opacity: 1; } 100% { opacity: 0; }
      }

      .typeRect { transform: scaleX(0); transform-box: fill-box; transform-origin: left center;
        animation: typing 2.2s steps(34,end) 0.6s forwards; }
      @keyframes typing { to { transform: scaleX(1);} }

      .log1 { opacity: 0; animation: rise 0.5s ease-out 3.0s forwards; }
      .log2 { opacity: 0; animation: rise 0.5s ease-out 3.5s forwards; }
      .log3 { opacity: 0; animation: rise 0.5s ease-out 4.0s forwards; }
      .log4 { opacity: 0; animation: rise 0.5s ease-out 4.5s forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(5px);} to { opacity: 1; transform: translateY(0);} }

      .cursor { animation: blink 1.1s steps(1,end) infinite; }
      @keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: 0;} }

      .beamline { animation: beampulse 6s ease-in-out infinite; }
      @keyframes beampulse { 0%,100% { opacity: 0.35;} 50% { opacity: 1;} }
    ]]></style>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <g stroke="#141a30" stroke-width="1" opacity="0.5">
    <path d="M0 110 H1200 M0 220 H1200 M0 330 H1200"/>
    <path d="M200 0 V440 M400 0 V440 M600 0 V440 M800 0 V440 M1000 0 V440"/>
  </g>

  <g class="aB"><ellipse cx="380" cy="190" rx="360" ry="170" fill="url(#auraB)" filter="url(#soft)"/></g>
  <g class="aR"><ellipse cx="840" cy="240" rx="340" ry="160" fill="url(#auraR)" filter="url(#soft)"/></g>

  <g fill="#cdd8ff">
    <circle class="tw1" cx="96"  cy="72"  r="1.4"/>
    <circle class="tw2" cx="212" cy="150" r="1.1"/>
    <circle class="tw3" cx="318" cy="58"  r="1.3"/>
    <circle class="tw1" cx="468" cy="96"  r="1.0"/>
    <circle class="tw2" cx="642" cy="52"  r="1.4"/>
    <circle class="tw3" cx="768" cy="118" r="1.1"/>
    <circle class="tw1" cx="902" cy="66"  r="1.3"/>
    <circle class="tw2" cx="1042" cy="132" r="1.2"/>
    <circle class="tw3" cx="1128" cy="76"  r="1.4"/>
    <circle class="tw1" cx="1006" cy="330" r="1.1"/>
    <circle class="tw2" cx="150"  cy="308" r="1.2"/>
    <circle class="tw3" cx="560"  cy="392" r="1.0"/>
  </g>

  <ellipse cx="600" cy="218" rx="450" ry="118" fill="none" stroke="#232c4e" stroke-width="1" stroke-dasharray="1 7"/>
  <circle r="3.2" fill="#9db4ff">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>
  <circle r="7" fill="#9db4ff" opacity="0.25" filter="url(#soft)">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>
  <circle r="2.4" fill="#ff8296">
    <animateMotion dur="14s" begin="-7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
  </circle>

  <g class="mono" font-size="11" letter-spacing="2">
    <text x="70" y="66" class="dim">ZONE://OS&#160;&#160;v2026.07</text>
    <text x="1130" y="66" text-anchor="end" class="dim">SIGNAL: ALIVE</text>
  </g>
  <g stroke="#2c3560" stroke-width="1.5" fill="none">
    <path d="M52 46 h16 M52 46 v16"/><path d="M1148 46 h-16 M1148 46 v16"/>
    <path d="M52 394 h16 M52 394 v-16"/><path d="M1148 394 h-16 M1148 394 v-16"/>
  </g>

  <text x="600" y="148" text-anchor="middle" class="mono dim" font-size="12" letter-spacing="6">MINSUNG PARK — METHEZONE</text>

  <g>
    <text x="600" y="240" text-anchor="middle" class="disp breathe" font-size="96" font-weight="800" letter-spacing="20" fill="url(#mark)" filter="url(#soft)">THE ZONE</text>
    <text x="600" y="240" text-anchor="middle" class="disp" font-size="96" font-weight="800" letter-spacing="20" fill="url(#mark)">THE ZONE</text>
  </g>

  <rect x="420" y="262" width="360" height="2" fill="url(#beam)" class="beamline"/>

  <g class="mono" font-size="14" letter-spacing="4" text-anchor="middle">
    <text x="600" y="298" class="rot"  fill="#8b96bd">ENGINEERING&#160;&#160;ALIVENESS</text>
    <text x="600" y="298" class="rot2" fill="#8b96bd">AX&#160;COMPANIONS&#160;·&#160;AGENTS&#160;·&#160;MEMORY&#160;GRAPHS</text>
    <text x="600" y="298" class="rot3" fill="#8b96bd">SEOUL&#160;→&#160;BALI&#160;·&#160;BUILDING&#160;IN&#160;PUBLIC</text>
  </g>

  <g class="mono" font-size="12">
    <text x="70" y="357" fill="#7ee2c3" clip-path="url(#typeClip)">$ zone boot --profile methezone --loud</text>
    <g fill="#59617e">
      <text x="70" y="379" class="log1">▸ core&#160;&#160;&#160;&#160;: aliveness&#160;............&#160;<tspan fill="#7ee2c3">ONLINE</tspan></text>
      <text x="70" y="399" class="log2">▸ agents&#160;&#160;: arca · pix&#160;...........&#160;<tspan fill="#9db4ff">RUNNING</tspan></text>
      <text x="640" y="379" class="log3">▸ memory&#160;&#160;: zonebrain&#160;............&#160;<tspan fill="#9db4ff">SYNCED</tspan></text>
      <text x="640" y="399" class="log4">▸ waypoint: bali&#160;.................&#160;<tspan fill="#ff8296">2026.09</tspan></text>
    </g>
    <rect x="1075" y="390" width="8" height="13" fill="#7ee2c3" class="cursor"/>
  </g>

  <text x="1130" y="424" text-anchor="end" class="mono" font-size="10" letter-spacing="2" fill="#3c4463">37.5665°N 126.9780°E&#160;&#160;→&#160;&#160;8.6500°S 115.2167°E</text>
</svg>
