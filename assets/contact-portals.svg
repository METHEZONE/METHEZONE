<svg width="980" height="90" viewBox="0 0 980 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="METHEZONE contact portals">
  <defs>
    <style>
      .hud { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 20px; font-weight: 900; letter-spacing: .3px; }
      @keyframes pulse { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="980" height="90" rx="16" fill="#071018"/>
  <a href="https://www.instagram.com/minthezone/">
