      <rect x="36" y="22" width="260" height="46" rx="8" fill="#27101c" stroke="#ff5ca8" stroke-width="3"/>
      <text x="66" y="52" class="hud" fill="#ff8fc3">@minthezone</text>
    </g>
  </a>
  <a href="https://www.instagram.com/i.minthezone/">
    <g class="pulse" style="animation-delay:-.7s">
      <rect x="360" y="22" width="260" height="46" rx="8" fill="#11102b" stroke="#9b7cff" stroke-width="3"/>
      <text x="386" y="52" class="hud" fill="#c5b4ff">@i.minthezone</text>
    </g>
  </a>
  <a href="https://www.instagram.com/thezonebio/">
    <g class="pulse" style="animation-delay:-1.3s">
      <rect x="684" y="22" width="260" height="46" rx="8" fill="#0b1e27" stroke="#33f5c5" stroke-width="3"/>
      <text x="714" y="52" class="hud" fill="#33f5c5">@thezonebio</text>
    </g>
